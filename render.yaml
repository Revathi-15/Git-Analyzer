services:
  - type: web
    name: git-analyzer-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false        # you set this manually in Render dashboard
      - key: GITHUB_TOKEN
        sync: false        # you set this manually in Render dashboard
    autoDeploy: true
