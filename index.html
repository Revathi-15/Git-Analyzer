<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Analyzer - AI-Powered GitHub Repository Explorer</title>
    <meta name="description" content="Understand GitHub repositories with AI-powered insights and analysis" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #03040a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

      /* ── Canvas background (animated via JS) ───────────────────────────── */
      #splash-canvas {
        position: fixed; inset: 0; z-index: 0;
      }

      /* ── Splash wrapper ─────────────────────────────────────────────────── */
      #splash {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 36px;
        transition: opacity 0.7s cubic-bezier(.4,0,.2,1), visibility 0.7s;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      /* ── Dot grid ───────────────────────────────────────────────────────── */
      #splash::before {
        content: '';
        position: absolute; inset: 0; z-index: -1;
        background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
      }

      /* ── Glow orbs ──────────────────────────────────────────────────────── */
      .orb {
        position: absolute; border-radius: 50%;
        filter: blur(100px); pointer-events: none;
        animation: orbDrift 10s ease-in-out infinite;
      }
      .o1 { width:600px;height:600px;background:radial-gradient(#1d4ed8,transparent 70%);top:-15%;left:-10%;opacity:0.22;animation-delay:0s;}
      .o2 { width:500px;height:500px;background:radial-gradient(#7c3aed,transparent 70%);top:10%;right:-10%;opacity:0.18;animation-delay:3s;}
      .o3 { width:450px;height:450px;background:radial-gradient(#059669,transparent 70%);bottom:-10%;right:15%;opacity:0.14;animation-delay:6s;}
      .o4 { width:350px;height:350px;background:radial-gradient(#dc2626,transparent 70%);bottom:5%;left:10%;opacity:0.08;animation-delay:2s;}
      @keyframes orbDrift {
        0%,100%{transform:translate(0,0) scale(1);}
        33%{transform:translate(25px,-35px) scale(1.06);}
        66%{transform:translate(-18px,22px) scale(0.95);}
      }

      /* ── Logo area ──────────────────────────────────────────────────────── */
      .logo-container {
        position: relative;
        animation: logoEntrance 1s cubic-bezier(.22,1,.36,1) both;
      }
      @keyframes logoEntrance {
        from { opacity:0; transform:scale(0.5) translateY(20px); }
        to   { opacity:1; transform:scale(1) translateY(0); }
      }

      /* outer glow rings */
      .glow-ring {
        position: absolute; border-radius: 50%;
        border: 1px solid transparent; pointer-events: none;
      }
      .gr1 {
        inset: -20px;
        background: conic-gradient(from 0deg, #3b82f6, #8b5cf6, #10b981, #f59e0b, #3b82f6) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        mask-composite: exclude;
        border: 2px solid transparent;
        border-radius: 50%;
        animation: ringRotate 4s linear infinite;
        opacity: 0.9;
      }
      .gr2 {
        inset: -32px;
        border: 1px solid rgba(99,102,241,0.3);
        border-radius: 50%;
        animation: ringRotate 8s linear infinite reverse;
      }
      .gr3 {
        inset: -44px;
        border: 1px solid rgba(16,185,129,0.15);
        border-radius: 50%;
        animation: ringRotate 14s linear infinite;
      }
      @keyframes ringRotate { to { transform: rotate(360deg); } }

      /* glow pulse behind logo */
      .logo-glow {
        position: absolute; inset: -30px; border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.5) 0%, transparent 70%);
        animation: glowPulse 2.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes glowPulse {
        0%,100%{opacity:0.6;transform:scale(1);}
        50%{opacity:1;transform:scale(1.15);}
      }

      /* the actual logo box */
      .logo-box {
        position: relative; z-index: 2;
        width: 96px; height: 96px; border-radius: 28px;
        background: linear-gradient(135deg, #1e1b4b 0%, #2d1b69 40%, #1a3a2a 100%);
        border: 1px solid rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 25px 80px rgba(99,102,241,0.35), 0 0 0 1px rgba(255,255,255,0.06);
      }
      .logo-box svg { width: 52px; height: 52px; }

      /* ── Title block ────────────────────────────────────────────────────── */
      .title-block {
        text-align: center;
        animation: textEntrance 1s 0.2s cubic-bezier(.22,1,.36,1) both;
      }
      @keyframes textEntrance {
        from{opacity:0;transform:translateY(16px);}
        to{opacity:1;transform:translateY(0);}
      }

      .main-title {
        font-size: 42px; font-weight: 900; letter-spacing: -1.5px; line-height: 1;
        background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 35%, #94a3b8 70%, #64748b 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .sub-line {
        margin-top: 10px;
        font-size: 11px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #06b6d4, #10b981);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 300% 100%;
        animation: gradientSlide 3s ease-in-out infinite;
        opacity: 0; animation: textEntrance 1s 0.5s both, gradientSlide 4s 1.5s linear infinite;
      }
      @keyframes gradientSlide {
        0%,100%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
      }

      /* ── Typewriter line ────────────────────────────────────────────────── */
      .typewriter-line {
        margin-top: 6px;
        font-size: 13px; color: #475569; font-weight: 400; letter-spacing: 0.3px;
        min-height: 20px;
        opacity: 0; animation: fadeInDelay 0.5s 1s ease forwards;
      }
      .typewriter-line .cursor {
        display: inline-block; width: 2px; height: 13px;
        background: #6366f1; margin-left: 1px; vertical-align: middle;
        animation: cursorBlink 0.8s step-end infinite;
      }
      @keyframes cursorBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
      @keyframes fadeInDelay { to { opacity:1; } }

      /* ── Bottom progress strip ──────────────────────────────────────────── */
      .progress-track {
        position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
        background: rgba(255,255,255,0.04);
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, transparent 0%, #6366f1 25%, #8b5cf6 50%, #06b6d4 75%, transparent 100%);
        background-size: 400% 100%;
        animation: progressSweep 2s ease-in-out infinite;
        width: 50%;
      }
      @keyframes progressSweep {
        0%  { transform:translateX(-100%); }
        100%{ transform:translateX(350%); }
      }

      /* ── Corner brackets ────────────────────────────────────────────────── */
      .brackets { position: absolute; inset: 20px; pointer-events: none; }
      .bracket {
        position: absolute; width: 24px; height: 24px; opacity: 0.25;
        animation: bracketFade 0.8s 1.2s ease forwards; opacity: 0;
      }
      @keyframes bracketFade { to { opacity: 0.2; } }
      .br-tl { top:0; left:0; border-top:1.5px solid #6366f1; border-left:1.5px solid #6366f1; border-radius:4px 0 0 0; }
      .br-tr { top:0; right:0; border-top:1.5px solid #8b5cf6; border-right:1.5px solid #8b5cf6; border-radius:0 4px 0 0; }
      .br-bl { bottom:0; left:0; border-bottom:1.5px solid #10b981; border-left:1.5px solid #10b981; border-radius:0 0 0 4px; }
      .br-br { bottom:0; right:0; border-bottom:1.5px solid #06b6d4; border-right:1.5px solid #06b6d4; border-radius:0 0 4px 0; }
    </style>
  </head>

  <body class="dark">

    <!-- animated particle canvas -->
    <canvas id="splash-canvas"></canvas>

    <div id="splash">
      <!-- ambient orbs -->
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="orb o4"></div>

      <!-- corner brackets -->
      <div class="brackets">
        <div class="bracket br-tl"></div>
        <div class="bracket br-tr"></div>
        <div class="bracket br-bl"></div>
        <div class="bracket br-br"></div>
      </div>

      <!-- logo -->
      <div class="logo-container">
        <div class="logo-glow"></div>
        <div class="gr1 glow-ring"></div>
        <div class="gr2 glow-ring"></div>
        <div class="gr3 glow-ring"></div>
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#93c5fd"/>
                <stop offset="50%"  stop-color="#c4b5fd"/>
                <stop offset="100%" stop-color="#6ee7b7"/>
              </linearGradient>
            </defs>
            <circle cx="6"  cy="18" r="3"/>
            <circle cx="6"  cy="6"  r="3"/>
            <circle cx="18" cy="6"  r="3"/>
            <line x1="6" y1="9" x2="6" y2="15"/>
            <path d="M18 9a9 9 0 0 1-9 9"/>
          </svg>
        </div>
      </div>

      <!-- text -->
      <div class="title-block">
        <div class="main-title">Git Analyzer</div>
        <div class="sub-line">AI · RAG · Vector Search</div>
        <div class="typewriter-line" id="tw"></div>
      </div>

      <!-- tech pills removed -->

      <!-- shimmer progress bar -->
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- particle canvas + typewriter, runs immediately, no framework needed -->
    <script>
      // ── Particle canvas ──────────────────────────────────────────────────
      const canvas = document.getElementById('splash-canvas')
      const ctx = canvas.getContext('2d')
      let W, H, particles = []

      function resize() {
        W = canvas.width  = window.innerWidth
        H = canvas.height = window.innerHeight
      }
      resize()
      window.addEventListener('resize', resize)

      const COLORS = ['#6366f1','#8b5cf6','#06b6d4','#10b981','#3b82f6']
      for (let i = 0; i < 55; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.4 + 0.3,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          alpha: Math.random() * 0.5 + 0.1,
        })
      }

      function drawParticles() {
        if (!document.getElementById('splash')) return
        ctx.clearRect(0, 0, W, H)
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
          ctx.fillStyle = p.color
          ctx.globalAlpha = p.alpha
          ctx.fill()
        })
        // draw faint connecting lines between nearby particles
        ctx.globalAlpha = 1
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x
            const dy = particles[i].y - particles[j].y
            const dist = Math.sqrt(dx*dx + dy*dy)
            if (dist < 100) {
              ctx.beginPath()
              ctx.moveTo(particles[i].x, particles[i].y)
              ctx.lineTo(particles[j].x, particles[j].y)
              ctx.strokeStyle = particles[i].color
              ctx.globalAlpha = (1 - dist / 100) * 0.12
              ctx.lineWidth = 0.5
              ctx.stroke()
            }
          }
        }
        requestAnimationFrame(drawParticles)
      }
      requestAnimationFrame(drawParticles)

      // ── Typewriter ───────────────────────────────────────────────────────
      const lines = [
        'Fetching repository data...',
        'Preparing AI workspace...',
        'Loading vector engine...',
        'Almost ready...',
      ]
      const el = document.getElementById('tw')
      let li = 0, ci = 0, deleting = false

      function type() {
        if (!el || !document.getElementById('splash')) return
        const line = lines[li]
        if (!deleting) {
          el.innerHTML = line.slice(0, ci) + '<span class="cursor"></span>'
          ci++
          if (ci > line.length) { deleting = true; setTimeout(type, 1400); return; }
          setTimeout(type, 55)
        } else {
          ci--
          el.innerHTML = line.slice(0, ci) + '<span class="cursor"></span>'
          if (ci === 0) { deleting = false; li = (li + 1) % lines.length; setTimeout(type, 300); return; }
          setTimeout(type, 28)
        }
      }
      setTimeout(type, 1200)
    </script>
  </body>
</html>
